[pytest]
# Root-level pytest config anchors the rootdir to the repo root so that
# individual chapter pyproject.toml files don't hijack it when pytest is
# run from here.
#
# importlib mode gives each test file a unique module identity derived
# from its full path, which prevents collisions when multiple chapters
# have test files with the same basename (e.g. test_gates.py).
#
# Run a single chapter:   pytest chapters/ch02/tests/
# Run all chapters:       pytest chapters/
addopts = --import-mode=importlib
